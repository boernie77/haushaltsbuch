services:
  db:
    image: postgres:16-alpine
    container_name: haushaltsbuch-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: haushaltsbuch
      POSTGRES_USER: haushalt
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./data/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haushalt -d haushaltsbuch"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: haushaltsbuch-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://haushalt:${DB_PASSWORD}@db:5432/haushaltsbuch
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      PORT: 3000
      NODE_ENV: production
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      APP_URL: ${APP_URL}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      LEGAL_NAME: ${LEGAL_NAME:-}
      LEGAL_ADDRESS: ${LEGAL_ADDRESS:-}
      LEGAL_EMAIL: ${LEGAL_EMAIL:-}
      LEGAL_HOSTING: ${LEGAL_HOSTING:-}
      LEGAL_AUTHORITY: ${LEGAL_AUTHORITY:-}
      SOURCE_URL: ${SOURCE_URL:-}
      FINTS_SERVICE_URL: http://fints:8000
    volumes:
      - ./data/uploads:/app/uploads
    ports:
      - "3001:3000"

  # FinTS-Sidecar (Bank-Sync per FinTS/HBCI). Nicht nach außen veröffentlicht.
  # Ohne FINTS_PRODUCT_ID (eigene Registrierungsnummer, siehe README) bleibt
  # die Funktion ausgeschaltet; der Dienst läuft dann nur leer mit.
  fints:
    build: ./fints-service
    container_name: haushaltsbuch-fints
    restart: unless-stopped
    environment:
      FINTS_PRODUCT_ID: ${FINTS_PRODUCT_ID:-}

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: ${API_URL}
    container_name: haushaltsbuch-web
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend

