server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html nie aus dem Browser-Cache nehmen, sonst zeigt der Browser
    # nach einem Deploy weiter die alte Version (alte Bundle-Hashes). Greift
    # auch für SPA-Routen, die per try_files hier landen.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite-Bundles tragen einen Inhalts-Hash im Namen → dürfen ewig gecacht
    # werden.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Bank-Sync-Vorschau fragt ggf. eine KI (Claude oder eigener, evtl.
    # langsamer KI-Server) → deutlich mehr Zeit als der Standard (60 s).
    location /api/bank-sync/preview {
        proxy_pass http://backend:3000/api/bank-sync/preview;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /uploads/ {
        proxy_pass http://backend:3000/uploads/;
    }
}
